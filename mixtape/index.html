<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202124">
  <title>Mixtape Run · Paddle Noir</title>
  <link rel="icon" href="../favicon.png">
  <link rel="stylesheet" href="./ride.css">
</head>
<body>
  <main class="sleeve">
    <nav><a href="../" aria-label="Back to Paddle Noir">← Paddle Noir</a><button id="sound" aria-pressed="true">Sound on</button></nav>
    <header><div class="format">Home recording <span>•</span> Summer ’96</div><h1>Mixtape Run<span aria-hidden="true">.</span></h1></header>
    <div class="deck">
      <div class="readout"><strong id="stage">01 / Corner shop</strong><span><b id="points">00000</b> pts</span></div>
      <div class="screen">
        <canvas width="384" height="242" aria-label="Two cyclists ride towards the arcade. Mint rides the upper lane, amber the lower lane."></canvas>
        <div id="message" role="status"></div>
        <div id="cover" hidden><h2 id="cover-title"></h2><p id="summary"></p><button id="resume">Resume ride</button></div>
      </div>
      <div class="route" aria-label="Route progress"><i id="progress"></i></div>
    </div>
    <section id="lobby" aria-label="Choose players">
      <h2>Meet me at the arcade.</h2>
      <p>Two bikes, one homemade tape. Jump the hurdles. Catch both sides of a cassette to build the soundtrack together.</p>
      <div class="choices"><button id="solo">Solo <small>with a buddy</small></button><button id="duo">Two players <small>local co-op</small></button></div>
      <p class="record" id="record"></p>
    </section>
    <section id="controls" aria-label="Ride controls" hidden>
      <div class="keys"><button id="hop-one"><span id="hop-label">Hop</span> <kbd>Space</kbd></button><button id="hop-two">Amber <kbd>L</kbd></button><button id="pause" aria-label="Pause ride">Ⅱ</button></div>
      <p id="hint"></p>
    </section>
    <section id="results" hidden><div class="choices"><button id="retry">Ride again</button><button class="secondary" id="change">Change players</button></div></section>
  </main>
  <script type="module" src="./ride.js"></script>
</body>
</html>
